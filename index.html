<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cooking Battle - Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 15px; left: 15px; color: #fff; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; min-width: 220px; }
        #order-box { position: absolute; top: 15px; right: 15px; color: #fff; background: rgba(255,152,0,0.85); padding: 15px; border-radius: 10px; font-weight: bold; }
        #instructions { position: absolute; bottom: 15px; left: 15px; color: #fff; background: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 8px; font-size: 13px; }
        #game-over { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); color: #fff; padding: 40px; border-radius: 15px; text-align: center; font-size: 24px; border: 2px solid #ffca28; }
        .val { color: #4caf50; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui">
    <h3 style="margin:0 0 10px 0; color:#ffca28;">Cooking Battle Pro</h3>
    <div>คะแนน: <span id="score" class="val">0</span></div>
    <div>เวลาแข่งขัน: <span id="match-time" class="val">120</span>s</div>
    <div>ในมือ: <span id="holding" class="val">ไม่มี</span></div>
    <div>เตา: <span id="stove" class="val">ว่าง</span></div>
</div>

<div id="order-box">
    ออเดอร์ลูกค้า: <span id="current-order">กำลังโหลด...</span>
</div>

<div id="instructions">
    [W,A,S,D] เดิน | [E] แอ็กชันตามจุดต่างๆ<br>
    🟢 ลังอาหารดิบ ➔ 🟧 เขียงหั่น ➔ 🔴 เตาต้ม ➔ 🟡 โต๊ะส่ง ➔ ⬛ ถังขยะ
</div>

<div id="game-over">
    <h2>หมดเวลาการแข่งขัน!</h2>
    <p>คะแนนรวมที่ทำได้: <span id="final-score" style="color:#ffca28;">0</span> คะแนน</p>
    <button onclick="location.reload()" style="padding:10px 20px; font-size:16px; cursor:pointer;">เล่นใหม่อีกครั้ง</button>
</div>

<script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 9, 9);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(5, 12, 7);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    // --- MAP OBJECTS ---
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ color: 0x2a2a38 }));
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const player = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.8), new THREE.MeshStandardMaterial({ color: 0x2196f3 }));
    player.position.set(0, 0.6, 2);
    scene.add(player);

    // Station Helper
    function createStation(x, z, color, label) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 1.2), new THREE.MeshStandardMaterial({ color: color }));
        mesh.position.set(x, 0.5, z);
        scene.add(mesh);
        return mesh;
    }

    const crateStation = createStation(-3.5, -2, 0x4caf50);  // ลังดิบ (เขียว)
    const chopStation  = createStation(-1.2, -2, 0xff9800);  // เขียง (ส้ม)
    const stoveStation = createStation(1.2, -2, 0xf44336);   // เตา (แดง)
    const counterStation= createStation(3.5, -2, 0xffeb3b);  // ส่งอาหาร (เหลือง)
    const trashStation = createStation(4, 2, 0x333333);      // ถังขยะ (เทา)

    // --- GAME STATE ---
    let score = 0;
    let matchTime = 120;
    let holding = null; // null, "Raw Food", "Chopped Food", "Cooked Food", "Burnt Food"
    let chopProgress = 0;
    let stoveState = "ว่าง"; // "ว่าง", "กำลังต้ม...", "สุกแล้ว!", "ไหม้แล้ว!"
    let stoveTimer = 0;
    let currentOrder = "ผักต้มสุก";
    let isGameOver = false;

    const keys = {};
    window.addEventListener('keydown', e => {
        if(isGameOver) return;
        keys[e.key.toLowerCase()] = true;

        if(e.key.toLowerCase() === 'e') {
            // 1. หยิบของดิบจากลัง
            if(player.position.distanceTo(crateStation.position) < 1.6 && !holding) {
                holding = "Raw Food";
            }
            // 2. หั่นที่เขียง
            else if(player.position.distanceTo(chopStation.position) < 1.6 && holding === "Raw Food") {
                holding = "Chopped Food";
            }
            // 3. วางลงเตา / หยิบออกจากเตา
            else if(player.position.distanceTo(stoveStation.position) < 1.6) {
                if(holding === "Chopped Food" && stoveState === "ว่าง") {
                    holding = null;
                    stoveState = "กำลังต้ม...";
                    stoveTimer = 0;
                } else if(!holding && (stoveState === "สุกแล้ว!" || stoveState === "ไหม้แล้ว!")) {
                    holding = stoveState === "สุกแล้ว!" ? "Cooked Food" : "Burnt Food";
                    stoveState = "ว่าง";
                }
            }
            // 4. ส่งอาหาร
            else if(player.position.distanceTo(counterStation.position) < 1.6 && holding === "Cooked Food") {
                score += 150;
                holding = null;
            }
            // 5. ทิ้งขยะ
            else if(player.position.distanceTo(trashStation.position) < 1.6 && holding) {
                holding = null;
            }
            updateUI();
        }
    });

    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('holding').innerText = holding || 'ไม่มี';
        document.getElementById('stove').innerText = stoveState;
        document.getElementById('current-order').innerText = currentOrder;
        document.getElementById('match-time').innerText = Math.max(0, Math.ceil(matchTime));
    }

    // --- GAME LOOP ---
    let lastTime = performance.now();
    function animate(currentTime) {
        if(isGameOver) return;
        requestAnimationFrame(animate);

        const delta = (currentTime - lastTime) / 1000;
        lastTime = currentTime;

        // นับเวลาถอยหลังการแข่งขัน
        matchTime -= delta;
        if(matchTime <= 0) {
            isGameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'block';
            return;
        }

        // เดิน
        const spd = 0.08;
        if(keys['w'] && player.position.z > -4) player.position.z -= spd;
        if(keys['s'] && player.position.z < 4) player.position.z += spd;
        if(keys['a'] && player.position.x > -5) player.position.x -= spd;
        if(keys['d'] && player.position.x < 5) player.position.x += spd;

        // ระบบต้ม & ไหม้
        if(stoveState === "กำลังต้ม...") {
            stoveTimer += delta;
            if(stoveTimer >= 4 && stoveTimer < 8) {
                stoveState = "สุกแล้ว!";
                updateUI();
            }
        } else if(stoveState === "สุกแล้ว!") {
            stoveTimer += delta;
            if(stoveTimer >= 9) { // ปล่อยไว้นานเกิน 9 วินาทีจะไหม้
                stoveState = "ไหม้แล้ว!";
                updateUI();
            }
        }

        updateUI();
        renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
</script>
</body>
</html>
